
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server:path"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  VITE_API_URL = "https://leblanc-backend.onrender.com"

[context.deploy-preview.environment]
  NODE_ENV = "staging"
